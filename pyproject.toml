[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qihun-memory"
version = "0.3.0"
description = "器魂记忆系统 v1.6-rc4 — 面向单个 QQ 群 + 私聊的轻量长期记忆引擎（含情感日记叙事层）"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ang516" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
qihun-memory = "qihun_memory.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
